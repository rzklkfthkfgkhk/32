<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimeHub - Смотреть аниме</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo" id="logoLink">
                <i class="fas fa-play-circle"></i>
                <span>Anime<span>Hub</span></span>
            </div>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Найти аниме..." />
                <button id="searchBtn"><i class="fas fa-arrow-right"></i></button>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats">
            <span><i class="fas fa-database"></i> AniList</span>
            <span><i class="fas fa-play"></i> Встроенный плеер</span>
            <span id="count"><i class="fas fa-list"></i> 0</span>
        </div>

        <!-- Grid -->
        <div id="grid" class="grid"></div>

        <!-- Player -->
        <div id="player" class="player hidden">
            <div class="player-top">
                <div class="player-title">
                    <i class="fas fa-play-circle"></i>
                    <h2 id="playerTitle">Название</h2>
                </div>
                <div class="player-btns">
                    <button onclick="window.goHome()" title="На главную"><i class="fas fa-home"></i></button>
                    <button id="closePlayer" title="Закрыть"><i class="fas fa-times"></i></button>
                </div>
            </div>

            <div class="player-controls">
                <div class="episode-select">
                    <label><i class="fas fa-list"></i> Серия:</label>
                    <select id="episodeSelect"></select>
                </div>
                <div class="source-info" id="sourceInfo">
                    <i class="fas fa-sync-alt fa-spin"></i> Загрузка...
                </div>
            </div>

            <div class="player-wrapper">
                <iframe id="playerFrame" src="" allowfullscreen></iframe>
            </div>

            <div class="player-status" id="playerStatus">
                <i class="fas fa-info-circle"></i> Выберите аниме
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p><i class="fas fa-code"></i> Данные AniList · Встроенный плеер</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
